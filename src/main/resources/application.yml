server:
  port: 8080

spring:
  application:
    name: polymarket-common-bets
  datasource:
    url: jdbc:h2:file:./data/polybets;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  thymeleaf:
    cache: false
  h2:
    console:
      enabled: true
      path: /h2-console

logging:
  level:
    com.example.polybets: INFO

polymarket:
  data-api-base-url: https://data-api.polymarket.com
  top-n: 20
  default-category: POLITICS
  time-period: MONTH
  order-by: PNL
  min-common-holders: 2
  positions-limit: 500
  closed-window-days: 3
  sync:
    # Her 30 dakikada bir tum kategorileri senkronize eder
    cron: "0 */30 * * * *"
    enabled: true
